# KIU-USCAS production stack on one Linux host with Docker. Read docs/DEPLOYMENT.md first (including "Go-live gates").
#   cp deploy/.env.production.example .env.production   # or: node deploy/gen-secrets.mjs
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build
# Nothing here has been run in the development environment (it has no Docker); smoke-test before use.
name: kiu-uscas

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: kiu_uscas
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]            # no published port: only the API and the backup job can reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiu -d kiu_uscas"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { context: .., dockerfile: deploy/Dockerfile, target: api }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://kiu:${POSTGRES_PASSWORD}@db:5432/kiu_uscas?schema=public
      # No PgBouncer in this single-container Postgres, so direct == pooled (Supabase deployments
      # need a genuinely different value here; see docs/DEPLOY_VERCEL_SUPABASE.md).
      DIRECT_URL: postgresql://kiu:${POSTGRES_PASSWORD}@db:5432/kiu_uscas?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
      CARD_MASTER_KEY: ${CARD_MASTER_KEY:?set CARD_MASTER_KEY}
      CACHE_SIGNING_KEY: ${CACHE_SIGNING_KEY:?set CACHE_SIGNING_KEY}
      COOKIE_SECURE: "true"
      SEED_DEMO_ACCOUNTS: "false"
      # Same-origin through the proxy, so no cross-origin access is granted to anyone.
      CORS_ORIGINS: ""
      OFFLINE_CACHE_TTL_MINUTES: ${OFFLINE_CACHE_TTL_MINUTES:-30}
      CARD_VALIDITY_MONTHS: ${CARD_VALIDITY_MONTHS:-36}
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      ADMIN_HOST: ${ADMIN_HOST:?set ADMIN_HOST, e.g. admin.example.org}
      WALLET_HOST: ${WALLET_HOST:?set WALLET_HOST, e.g. wallet.example.org}
      READER_HOST: ${READER_HOST:?set READER_HOST, e.g. reader.example.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

  # Daily compressed dump kept for BACKUP_KEEP_DAYS. Copy ./backups off this machine too: a backup on the same disk is not a backup.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ../backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    networks: [internal]

networks:
  internal: { internal: true }
  edge: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
