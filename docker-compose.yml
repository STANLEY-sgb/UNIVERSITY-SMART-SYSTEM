# Local infrastructure for KIU-USCAS (development). Not a production configuration.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kiu
      POSTGRES_PASSWORD: kiu_dev_password
      POSTGRES_DB: kiu_uscas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiu -d kiu_uscas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MQTT broker for the reader topic contracts (used from Phase 8).
  # Anonymous access is disabled by infrastructure/mosquitto/mosquitto.conf.
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: ["mqtt"]
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pgdata:
